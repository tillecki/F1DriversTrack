name = "grid-call"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The built SPA. The Worker handles /api/* and hands everything else to ASSETS.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Hourly: new results in, notifications out.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "grid-call"
database_id = "c0e58132-769c-4775-a444-50bc07a193b8"

[vars]
SEASON = "2026"
USER_AGENT = "GridCall/1.0 (self-hosted F1 prediction game)"
# From `npm run push:keys`. The public half is not a secret.
VAPID_PUBLIC_KEY = "BPMdu6P9nTAPr3cmVotSB0CQApbk-PZElrRT6Q-o9O6sPcbjvDKGuTpSC2LWMlkpDI0iIaSNSCKaGX3rTg_MwOQ"

# Secrets are NOT here. Set them with `wrangler secret put`:
#   JOIN_CODE        the code friends need to join
#   SESSION_SECRET   a long random string for signing cookies
#   ADMIN_CODE       elevates a player to organiser
#   VAPID_PRIVATE_JWK  the private half of the push keypair
#   VAPID_SUBJECT      mailto: address, required by the push services
